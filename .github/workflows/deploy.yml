name: Deploy to GitHub Pages

# Deploy reacts to CI finishing (workflow_run) rather than duplicating lint/test/build here, so
# nothing reaches Pages that has not been through the same gate as a pull request.
# workflow_dispatch is kept for a manual re-deploy without a new commit.
#
# The `branches: [main]` filter below matters more than it looks: without it, every CI run on
# every pull request branch also fires this workflow (CI runs on every branch), and every one of
# those runs shares the single `pages` concurrency group below. With several PRs landing close
# together, that queue of irrelevant triggers can starve out or cancel the one real deploy before
# its job-level `if` even gets evaluated — which is exactly what happened the day two tickets
# merged minutes apart and the real deploy for the second one never ran. Filtering at the trigger
# means a PR branch's CI completion never enters the queue at all.
#
# The Pages base path lives in exactly one place: the `build:pages` script in package.json
# (`--base-href /hair-saloon/`). It is not repeated here, so `npm run preview` locally serves the
# same paths this job deploys.
#
# If that path ever changes — the repository is renamed, or transferred to another owner — the
# Pages URL changes with it, and the Auth0 allowed callback URLs, allowed logout URLs and allowed
# web origins must be updated in the same change. A stale Auth0 URL breaks login the moment the
# new Pages URL goes live. See docs/handover.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Builds with the Pages base href and writes 404.html (the deep-link fallback) and
      # .nojekyll into the output. Both come from tools/pages-postbuild.mjs.
      - run: npm run build:pages

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/hair-saloon/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
